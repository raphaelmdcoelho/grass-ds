name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commitlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint every commit in the PR
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  verify:
    name: Lint, build, contrast, test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm check:contrast
      - run: pnpm test
      - run: pnpm build:catalog

  # The drift check. Meant to be a required check, so keep the job name `Parity` stable. It runs in
  # parallel with `verify` and builds the catalog itself so it does not wait for it.
  parity:
    name: Parity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PARITY_OUT: ${{ github.workspace }}/parity-out
      # One worker (and browser) per vCPU of the runner.
      PARITY_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:catalog
      # The browser build depends only on the playwright-core version, not on the whole lockfile.
      - name: Read the playwright-core version
        id: playwright
        run: echo "version=$(pnpm --filter @grass-ds/catalog-parity exec node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Chromium browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # With a warm cache this only checks the browser; --with-deps always installs the system
      # libraries, which the cache does not cover.
      - name: Install Chromium and its system libraries
        run: pnpm --filter @grass-ds/catalog-parity exec playwright-core install --with-deps chromium
      - run: pnpm parity
      - name: Upload the mismatching screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-mismatches # reference, angular and red-overlay diff PNGs
          path: parity-out
          if-no-files-found: ignore
