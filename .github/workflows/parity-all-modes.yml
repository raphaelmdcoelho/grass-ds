name: Parity (all modes)

# Not a pull request check and not required: the drift check of ci.yml runs the interaction states in
# light and dark-forced only, to stay fast. Weekly (and on demand) this runs them in all four modes,
# so a drift that only shows in dark or in light forced colours is found within a week.
on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity-all-modes:
    name: Parity (all modes)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PARITY_OUT: ${{ github.workspace }}/parity-out
      PARITY_CONCURRENCY: 4
      PARITY_STATE_MODES: light,dark,light-forced,dark-forced
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:catalog
      - name: Read the playwright-core version
        id: playwright
        run: echo "version=$(pnpm --filter @grass-ds/catalog-parity exec node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache the Chromium browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system libraries
        run: pnpm --filter @grass-ds/catalog-parity exec playwright-core install --with-deps chromium
      - run: pnpm parity
      - name: Upload the mismatching screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parity-mismatches
          path: parity-out
          if-no-files-found: ignore
